; Promicro NRF52840 + XD6500SHT (SX1262)
[env:promicro_nrf52840_xd6500sht]
extends = nrf52_base
board = promicro_nrf52840
board_build.variant = promicro_nrf52840

build_flags = ${nrf52_base.build_flags}
    -DNRF52_PLATFORM
    -DUSE_SX1262
    -DSX126X_CS=10
    -DSX126X_SCK=18
    -DSX126X_MOSI=15
    -DSX126X_MISO=14
    -DSX126X_RESET=4
    -DSX126X_BUSY=5
    -DSX126X_DIO1=6
    -DSX126X_TXEN=7
    -DSX126X_RXEN=8
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_MAX_POWER=22
    -DLORA_FREQ=869.618
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_POWER=20
    -DENABLE_ADVERT_ON_BOOT=1
    -DENABLE_PRIVATE_KEY_IMPORT=1
    -DENABLE_PRIVATE_KEY_EXPORT=1

monitor_speed = 115200
upload_protocol = nrfutil